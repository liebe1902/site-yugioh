<hr>
        <h1><i>elfnotes</i></h1>
        <section>
            <h2>sobre o deck</h2>
            <figure>
                <img src="img/elfnotes img.jpg" width="300" height="250" alt="carta elfnote">
                <figcaption>
                    <p>As Elfnotes(elfnotas) são apresentadas como cantoras com aparência élfica, e o próprio nome sugere a combinação de "Elf" + "Note", isto é, elfo + nota musical. A nomenclatura japonesa é エルフェンノーツ (Erufennōtsu).</p>
<br>
                    <p>A mecânica da zona central representa literalmente o centro de um palco. Uma Elfnota ocupa o centro, realiza seu efeito e as personagens podem trocar de posição durante a apresentação.</p>
<br>
                    <p>Com exceção de " Elfnote Power Patron ", os membros do arquétipo derivam seus nomes de flores, sendo que os nomes dos elfos também lembram os de deusas romanas. Eles também são associados a diferentes cores.</p>
                </figcaption> 
            </figure>
        </section>
